# Quality gates. A gate PASSES only when every criterion under it is checked true.
# Status values: NOT_STARTED | IN_PROGRESS | PASSED | FAILED

gates:
  G0_BOOTSTRAP:
    status: IN_PROGRESS
    criteria:
      - id: g0-1
        desc: "모든 앱이 로컬에서 실행"
        status: PASSED
        note: "CR-001 WEB_ONLY MVP 실행 앱 기준 통과: user-web/admin dev 서버로 E2E/perf smoke 실행, backend uvicorn /health/live 200 확인. 기존 apps/kiosk는 cleanup 참고자료"
      - id: g0-2
        desc: "Docker Compose 실행"
        status: BLOCKED
        note: "infra/scripts/verify-docker-stack 추가. 현재 세션은 docker command 부재로 NOT_RUN, Docker 가용 환경에서 compose health/backend image build 재검증 필요"
      - id: g0-3
        desc: "PostgreSQL 연결"
        status: PASSED
        note: "임시 PostgreSQL 17 + pgvector clean DB에서 migration roundtrip 통과. Docker Compose postgres health는 g0-2/FND-004에 남김"
      - id: g0-4
        desc: "Redis 연결"
        status: UNVERIFIED
        note: "현재 백엔드 코드가 Redis를 실제로 사용하는 경로가 없음(캐시 미구현) - C-7에서 설계만 존재"
      - id: g0-5
        desc: "Health Check 성공"
        status: PARTIAL_PASS
        note: "QAS-006으로 /health/live, /health/ready, /api/v1/system/info, /healthz 테스트 반영 및 통과. 실제 Docker/Redis/Postgres ready 상태는 FND-004에서 재검증"
      - id: g0-6
        desc: "CI 기본 파이프라인 성공"
        status: PARTIAL_PASS
        note: ".github/workflows/ci.yml 존재 및 WEB_ONLY frontend/e2e/performance/docker verifier jobs로 확장. YAML 파싱과 주요 로컬 명령 통과. infra/scripts/verify-github-actions 추가, 원격은 아직 workflow 미노출/미실행"

