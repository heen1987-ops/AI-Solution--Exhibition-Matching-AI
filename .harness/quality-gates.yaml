        status: PASSED
        note: "CTR-006 profile.saved_recommendable + CTR-007 ai.* 6테이블 추가. PostgreSQL 17 + pgvector 임시 DB에서 upgrade/downgrade 왕복 성공"
      - id: g1-4
        desc: "온톨로지 유효"
        status: PASSED
