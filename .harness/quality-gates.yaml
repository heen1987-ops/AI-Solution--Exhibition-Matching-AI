gates:
  G0_BOOTSTRAP:
    status: PASSED
    criteria:
      - "모든 앱이 로컬에서 실행된다 — backend(uvicorn) 확인됨, frontend(next dev) 확인됨(빌드 성공)"
      - "Docker Compose 실행 가능 — docker-compose.yml 존재, 미실행 상태로 검증(postgres/redis 컨테이너 기동 여부 미확인)"
      - "PostgreSQL 연결 — 미검증(로컬에 DB 인스턴스 없음, alembic --sql 오프라인 컴파일까지만 확인)"
      - "Redis 연결 — 미검증"
      - "Health Check 성공 — GET /healthz 라우트 등록 확인, 실제 응답은 서버 미기동으로 미검증"
      - "CI 기본 파이프라인 성공 — FND-003 engine+API 및 CR-009 active-web PR/main workflow 게시·로컬 재현 완료"
    verdict_note: "핵심 조건(코드 실행 가능·빌드 성공)은 충족. FND-003이 PR/main용 engine+API 및 활성 web CI를 게시했고 clean NTFS 기준 frozen install, lint, typecheck, test, build를 재검증했다. 실제 PostgreSQL/Redis 인프라 통합 기동은 G3 증거로 남는다."

  G1_CONTRACT_FREEZE:
    status: PASSED
    criteria:
      - "도메인모델 확정 — .harness/contracts/domain-model.md 승격 완료"
      - "OpenAPI 유효 — 기존 FastAPI 경로와 CR-006 인증 5개 경로를 포함한 73개 경로를 .harness/contracts/openapi.json 0.2.0으로 고정"
      - "DB 스키마 초안 — 완료(17개 마이그레이션, 단일 head 0017_object_embedding, 94 ORM 테이블)"
      - "온톨로지 유효 — 완료(259개 개념, catalog.v1.json)"
      - "오류코드 정의 — .harness/contracts/error-codes.yaml에 공개검색·인증/세션/RBAC/MFA 코드 포함"
      - "API Mock 동작 — 해당없음(이미 실제 백엔드가 존재하므로 Mock 대신 실제 API로 프론트가 동작 중)"
      - "계약 변경절차 정의 — AGENTS.md + 본 하네스 문서로 정의됨"
    verdict_note: "CONTRACT-002/003/006과 CR-004/CONTRACT-004 완료, DECISION-004/005/007 및 CR-006 반영 후 재동결. 이후 신규 경로는 OpenAPI 스냅샷과 오류코드 카탈로그를 함께 갱신한다."

  G2_FEATURE_COMPLETE:
    status: IN_PROGRESS
    criteria:
      - "핵심 API 구현 — 공개 카탈로그/검색/키오스크 완료, 관리자·관심목록 API 남음"
      - "user-web 핵심 흐름 구현 — 완료(4/4) + 익명 QR 게스트 조회 추가"
      - "kiosk 핵심 흐름 구현 — 완료(KIOSK-001~004, K00~K10 및 세션종료)"
      - "admin 핵심 흐름 구현 — 화면은 부분 구현, 실제 인증·관리자 API 의존으로 ADMIN-001~003 대기"
      - "검색·추천 구현 — PostgreSQL FTS·구조화 필터·SUMMARY-only filtered-HNSW semantic top-K·가중합·중복제거·fallback 완료, 운영 벡터 백필/평가는 G3에서 수행"
      - "상담 최소기능 구현 — 완료"
      - "권한 적용 — CR-006 계약은 완료, 실제 세션/JWT principal·RBAC·관리자 MFA와 신뢰 헤더 제거는 BACKEND-010 대기"
    blocking_tasks: [CONTRACT-005, BACKEND-007, BACKEND-009, BACKEND-010, ADMIN-001, ADMIN-002, ADMIN-003]

  G3_MVP_RELEASE:
    status: NOT_STARTED
    criteria:
      - "Lint/TypeCheck/Unit/Integration/E2E/Migration Test 성공 — 부분(0017 포함 Alembic upgrade/downgrade SQL 컴파일, 실제 DB HNSW EXPLAIN·exact-vs-ANN 회수율·원본변경 invalidation trigger 통합테스트 없음)"
      - "AI Gold Set 기준 통과 — query-interpreter 평가셋은 존재, semantic relevance 평가셋은 없음"
      - "권한시험 성공 — 실제 인증 미구현이라 시험 불가"
      - "개인정보 로그노출 0건 — 미검사"
      - "키오스크 세션잔존 0건 — 구현·컴포넌트 privacy test 완료, 실제 장치 E2E 미검사"
      - "성능목표 통과 — 미측정"
      - "외부 의미검색 비용보호 — 기본 OFF, 활성화 전 공개 검색 gateway/WAF rate limit 필요"
      - "제외범위 위반 0건 — 미검사(QA-001 대기)"
