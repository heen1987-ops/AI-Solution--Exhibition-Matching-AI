# Error code catalog — extracted from backend/app/**/*.py by grep, 2026-08-02.
# NOT exhaustive. Growing catalog: add codes here as new routers introduce them.
# HTTP status mapping is best-effort from surrounding code; verify against source before relying
# on it for client-side branching logic.

codes:
  # --- Auth / authorization ---
  - code: AUTH_REQUIRED
    http_status: 401
    meaning: "검증 가능한 브라우저 세션 또는 서비스 JWT가 없어 요청 principal을 만들 수 없음"
  - code: AUTH_LINK_INVALID
    http_status: 401
    meaning: "The personal access link is unknown, expired, consumed, or revoked; clients receive one generic response."
  - code: SESSION_EXPIRED
    http_status: 401
    meaning: "The server-managed session is missing, expired, or revoked and must not yield a principal."
  - code: TOKEN_INVALID
    http_status: 401
    meaning: "The service JWT failed signature, issuer, audience, time, algorithm, key, or revocation validation."
  - code: PRINCIPAL_CONFLICT
    http_status: 401
    meaning: "More than one incompatible credential or subject context was presented."
  - code: MFA_CHALLENGE_INVALID
    http_status: 401
    meaning: "The MFA challenge or proof is unknown, expired, consumed, mismatched, or exhausted."
  - code: RESOURCE_FORBIDDEN
    http_status: 403
    meaning: "인증된 주체가 해당 리소스에 접근할 권한이 없음"

  - code: SCOPE_FORBIDDEN
    http_status: 403
    meaning: "The verified principal does not belong to the requested tenant, event, exhibitor, or resource scope."
  - code: MFA_REQUIRED
    http_status: 403
    meaning: "The verified principal has a privileged role but has not completed required AAL2 authentication."
  - code: MFA_FRESHNESS_REQUIRED
    http_status: 403
    meaning: "The privileged action requires MFA completed within the configured freshness window."
  - code: CSRF_FAILED
    http_status: 403
    meaning: "The browser mutation failed the session-bound CSRF token or origin check."
  - code: AUTH_RATE_LIMITED
    http_status: 429
    meaning: "Authentication, access-link, MFA, or recovery attempts exceeded a non-secret rate limit."

  # --- Generic validation ---
  - code: VALIDATION_FAILED
    http_status: 422
    meaning: "요청 바디가 스키마 또는 비즈니스 규칙을 위반함"
  - code: INVALID_CURSOR
    http_status: 400
    meaning: "페이지네이션 커서 파싱 실패"
  - code: INTERNAL_ERROR
    http_status: 500
    meaning: "처리되지 않은 서버 내부 오류"

  # --- Profile ---
  - code: PROFILE_INCOMPLETE
    http_status: 422
    meaning: "필수 프로파일 항목 누락 — blocking_issues 배열과 함께 반환"
  - code: RECOMMENDATION_NOT_READY
    http_status: 404
    meaning: "사용자·행사에 속한 전달 가능한 추천 Snapshot이 아직 없음; 조회가 계산을 암묵적으로 시작하지 않음"

  # --- Meetings (backend/app/api/v1/routers/meetings.py) ---
  - code: IDEMPOTENCY_KEY_REUSED
    http_status: 409
    meaning: "동일 Idempotency-Key로 다른 페이로드 재요청"
  - code: MEETING_CONFLICT
    http_status: 409
    meaning: "슬롯 이중예약 또는 EXCLUDE 제약 위반 (동시성 충돌)"
  - code: MEETING_VERSION_CONFLICT
    http_status: 409
    meaning: "낙관적 잠금 실패 — row_version이 요청 시점과 다름"
  - code: NO_CANDIDATE
    http_status: 404
    meaning: "요청한 상담 후보(슬롯/담당자)가 존재하지 않음"
  - code: PARTNER_BUYER_CONTACT_VIEW
    http_status: 200
    meaning: "감사로그 이벤트 코드(오류 아님) — 파트너가 바이어 연락처를 열람했을 때 기록"
  - code: OUTCOME_RECORDED
    http_status: 200
    meaning: "감사로그 이벤트 코드(오류 아님) — 상담결과 기록 완료"

  # --- Exhibitor / partner (apps/api/app/api/v1/routers/partner.py) ---
  - code: EXHIBITOR_NOT_FOUND
    http_status: 404
  - code: PRODUCT_NOT_FOUND
    http_status: 404
  - code: EVENT_NOT_FOUND
    http_status: 404
  - code: BOOTH_NOT_FOUND
    http_status: 404
  - code: NO_PARTICIPATION_FOR_EVENT
    http_status: 422
    meaning: "해당 행사에 대한 참가신청 레코드가 없는 업체가 제품/거래조건을 등록하려 함"
  - code: BUYER_PREFERENCE_TAXONOMY_VERSION_MISMATCH
    http_status: 400
  - code: BUYER_PREFERENCE_EMPTY_DIMENSION
    http_status: 400

  # --- Public search (apps/api/app/api/v1/routers/search.py) ---
  - code: SEARCH_UNAVAILABLE
    http_status: 503
  - code: SEARCH_SESSION_STORE_UNAVAILABLE
    http_status: 503
  - code: SEARCH_SESSION_NOT_FOUND
    http_status: 404

  # --- Anonymous kiosk / QR handoff ---
  - code: KIOSK_LANGUAGE_NOT_SUPPORTED
    http_status: 422
  - code: KIOSK_SESSION_EXPIRED
    http_status: 410
  - code: KIOSK_SESSION_STORE_UNAVAILABLE
    http_status: 503
  - code: KIOSK_SEARCH_UNAVAILABLE
    http_status: 503
  - code: KIOSK_HANDOFF_SELECTION_INVALID
    http_status: 422
  - code: KIOSK_HANDOFF_INVALID
    http_status: 400
  - code: KIOSK_HANDOFF_EXPIRED
    http_status: 410
  - code: KIOSK_HANDOFF_UNAVAILABLE
    http_status: 503
  - code: KIOSK_HANDOFF_CATALOG_UNAVAILABLE
    http_status: 503

  # --- Imports (apps/api/app/api/v1/routers/imports.py) ---
  - code: IMPORT_NOT_FOUND
    http_status: 404
  - code: EXCEL_CONTENT_TYPE_UNSUPPORTED
    http_status: 415
    meaning: "XLSX MIME 형식이 아닌 업로드 요청"
  - code: EXCEL_FILE_SIZE_INVALID
    http_status: 422
    meaning: "빈 파일이거나 5MiB 제한을 초과한 XLSX"
  - code: EXCEL_FILE_INVALID
    http_status: 422
    meaning: "유효한 XLSX ZIP 패키지가 아니거나 읽을 수 없는 파일"
  - code: EXCEL_ARCHIVE_LIMIT_EXCEEDED
    http_status: 422
    meaning: "XLSX 내부 파일 수 또는 압축 해제 크기 제한 초과"
  - code: EXCEL_MACRO_NOT_ALLOWED
    http_status: 422
    meaning: "매크로를 포함한 XLSX 업로드 차단"
  - code: EXCEL_SHEET_DIMENSION_INVALID
    http_status: 422
    meaning: "비정상적으로 큰 시트 차원"
  - code: EXCEL_INPUT_SHEET_HIDDEN
    http_status: 422
    meaning: "사전등록자 또는 참여기업 입력 시트가 숨김 상태"
  - code: EXCEL_HEADERS_INVALID
    http_status: 422
    meaning: "입력 시트 열 이름·순서·개수가 게시 템플릿과 불일치"
  - code: EXCEL_INPUT_EMPTY
    http_status: 422
    meaning: "두 입력 시트 모두 비어 있음"
  - code: EXCEL_ROW_LIMIT_EXCEEDED
    http_status: 422
    meaning: "입력 시트의 비어 있지 않은 행이 1,000건을 초과"
  - code: EXCEL_FORMULA_NOT_ALLOWED
    http_status: 200
    meaning: "행 검증 오류 — 입력 셀에 수식 사용"
  - code: EXCEL_REQUIRED_VALUE_MISSING
    http_status: 200
    meaning: "행 검증 오류 — 필수값 누락"
  - code: EXCEL_DATETIME_INVALID
    http_status: 200
    meaning: "행 검증 오류 — source_updated_at 형식 오류"
  - code: EXCEL_BOOLEAN_INVALID
    http_status: 200
    meaning: "행 검증 오류 — 불리언 형식 오류"
  - code: EXCEL_ONTOLOGY_CODE_UNKNOWN
    http_status: 200
    meaning: "행 검증 오류 — 게시 온톨로지에 없는 코드"
  - code: EXCEL_ONTOLOGY_CODE_NOT_ASSIGNABLE
    http_status: 200
    meaning: "행 검증 오류 — 선택할 수 없는 상위 온톨로지 코드"
  - code: EXCEL_ONTOLOGY_TYPE_INVALID
    http_status: 200
    meaning: "행 검증 오류 — 열에 허용되지 않은 온톨로지 유형"
  - code: EXCEL_SINGLE_VALUE_REQUIRED
    http_status: 200
    meaning: "행 검증 오류 — 단일값 열에 복수 코드 입력"
  - code: EXCEL_SOURCE_ID_DUPLICATE
    http_status: 200
    meaning: "행 검증 오류 — 같은 시트의 source_record_id 중복"
  - code: EXCEL_ROW_SCHEMA_INVALID
    http_status: 200
    meaning: "행 검증 오류 — 필드 형식 또는 길이 위반"
  - code: EXCEL_MATCH_SOURCE_SYSTEM_NOT_FOUND
    http_status: 404
    meaning: "일괄 매칭 요청의 활성 원천 시스템을 찾을 수 없음"
  - code: EXCEL_MATCH_PROFILE_NOT_FOUND
    http_status: 200
    meaning: "XLSX 처리상태 행 — 원천 ID에 대응하는 동일 행사 프로파일이 없음"

  # --- Webhooks (apps/api/app/api/v1/routers/webhooks.py) ---
  - code: WEBHOOK_PAYLOAD_INVALID
    http_status: 400
  - code: WEBHOOK_SIGNATURE_INVALID
    http_status: 401
  - code: WEBHOOK_TIMESTAMP_INVALID
    http_status: 401
    meaning: "재전송 공격 방지 — 타임스탬프 허용범위 초과"
  - code: UNSUPPORTED_EVENT_TYPE
    http_status: 400
  - code: WEBHOOK_DATA_INVALID
    http_status: 400
  - code: WEBHOOK_PROCESSING_FAILED
    http_status: 500

  # --- Ontology (apps/api/app/api/v1/endpoints/ontology.py) ---
  - code: ONTOLOGY_CODE_NOT_FOUND
    http_status: 404
  - code: ONTOLOGY_VALUE_OUT_OF_RANGE
    http_status: 422

  # --- Profile attribute inference (apps/api/app/services/learning_policy.py) ---
  - code: EXPLICIT_INPUT_CONFLICT
    http_status: 409
    meaning: "행동 추론값이 사용자 명시적 입력과 충돌 — 명시값 우선 원칙에 따라 거부"

  # --- Recommendations (apps/api/app/api/v1/routers/recommendations.py) ---
  # Uses a dedicated ErrorBody/mapped-exception pattern (see source) rather than bare string
  # codes — read app/api/v1/routers/recommendations.py directly for the current mapping table
  # before relying on a fixed list here.

  # --- Buyer matching (apps/api/app/api/v1/routers/buyer_match.py, buyer_profile.py) ---
  # Ported from WAVE2C during the 2026-08-11 unification merge; the worktree never registered
  # error codes for these routers on its own error-codes.yaml (this whole section is new).
  - code: TOO_MANY_EXHIBITOR_IDS
    http_status: 422
    meaning: "POST /buyer/compare에 허용된 최대 업체 수를 초과해 요청함"
  - code: BUYER_PROFILE_VERSION_CONFLICT
    http_status: 409
    meaning: "낙관적 잠금 실패 — 바이어 프로파일이 이미 다른 요청으로 변경됨. 최신 값을 다시 조회 후 재시도"

  # --- Documents (apps/api/app/api/v1/routers/document.py, services/document/validation.py) ---
  - code: DOCUMENT_NOT_FOUND
    http_status: 404
  - code: DOCUMENT_HAS_NO_VERSION
    http_status: 422
    meaning: "게시된 버전이 없는 문서에 대해 버전 종속 작업을 요청함"
  - code: DOCUMENT_DUPLICATE_CONTENT
    http_status: 409
    meaning: "(content_hash, parser_version) 조합이 이미 존재함 — 동일 파일 재업로드"
  - code: DOCUMENT_DELETE_BLOCKED_PUBLISHED
    http_status: 409
    meaning: "이미 게시된 콘텐츠 버전을 가진 문서는 삭제할 수 없음"
  - code: DOCUMENT_TYPE_NOT_ALLOWED
    http_status: 400
  - code: DOWNLOAD_TOKEN_INVALID_OR_EXPIRED
    http_status: 404
    meaning: "/download-token으로 발급된 서명 토큰이 무효·만료됨(HMAC 서명 URL 모델 — 별도 principal 검증 없음, 의도적)"
  - code: FILE_TOO_LARGE
    http_status: 413
    meaning: "업로드 파일이 최대 크기를 초과함"
  - code: EXTENSION_NOT_ALLOWED
    http_status: 415
  - code: EXTENSION_MISSING
    http_status: 415
  - code: MIME_EXTENSION_MISMATCH
    http_status: 415
    meaning: "감지된 MIME 타입과 파일 확장자가 불일치"
  - code: CONTENT_NOT_ALLOWED
    http_status: 415
    meaning: "파일 내용 검사(예: 매크로 포함 여부)가 허용되지 않는 콘텐츠를 감지함"

  # --- AI extraction review (apps/api/app/api/v1/routers/extraction.py) ---
  - code: EXTRACTION_NOT_FOUND
    http_status: 404

  # --- Event messages (apps/api/app/api/v1/routers/event_message.py) ---
  - code: EVENT_MESSAGE_NOT_FOUND
    http_status: 404

  # --- Operator analytics (apps/api/app/api/v1/routers/analytics.py) ---
  - code: INVALID_ANALYTICS_ROLE
    http_status: 400
    meaning: "X-Analytics-Role이 호출자의 DB 기준 허용 role 집합을 벗어남 — 이 헤더는 좁히는 용도로만 쓰이며 넓힐 수 없음"
  - code: INVALID_PERIOD
    http_status: 422

  # --- In-app notifications (apps/api/app/api/v1/routers/notification.py) ---
  - code: NOTIFICATION_NOT_FOUND
    http_status: 404
  # --- Outbound notification delivery (apps/api/app/services/notification_delivery.py) ---
  # These are internal dispatch-outcome codes recorded on notification_attempt rows, not HTTP
  # error responses — listed here because they are stable identifiers a client-facing status
  # query could eventually surface.
  - code: PROVIDER_NOT_CONFIGURED
    http_status: null
    meaning: "선택된 채널(Alimtalk/SMS/Email)의 공급자 자격증명이 아직 구성되지 않음 — 실제 발송 비활성 상태의 정상 결과"
  - code: PROVIDER_REJECTED
    http_status: null
    meaning: "공급자가 요청을 거부함(allowlisted 오류코드로 변환, 원문 응답은 저장하지 않음)"
  - code: PROVIDER_UNAVAILABLE
    http_status: null
    meaning: "공급자 호출이 실패하거나 타임아웃됨 — 다음 채널로 폴백하거나 재시도 백오프"
  - code: RECIPIENT_UNAVAILABLE
    http_status: null
    meaning: "대상 채널에 대한 수신자 연락처가 없음(예: 이메일 미보유 사용자에게 EMAIL 채널 시도)"
  - code: EXTERNAL_SENDING_DISABLED
    http_status: null
    meaning: "공식 딜러·템플릿·콜백 계약이 아직 승인되지 않아 실제 외부 발송이 비활성화됨(DECISION-022)"
  - code: OPERATOR_RELEASE_REQUIRED
    http_status: null
    meaning: "NotificationReleaseGate의 3개 플래그 중 하나 이상이 아직 운영자 승인 전 상태"
  - code: CATALOG_NOT_READY
    http_status: null
    meaning: "추천 Snapshot이 아직 없어 RECOMMENDATION_READY 알림을 구성할 수 없음"

