openapi: 3.0.3
info:
  title: 백주대간 AI 매칭·탐색 서비스 API
  version: 0.1.0-contract
  description: >
    상태: CONFIRMED (CTR-002). 이 문서는 다음을 근거로 작성됐다:
    docs/redesign-v2/web/W-8-api-and-db-changes.md §5, docs/redesign-v2/common/
    C-5-common-api.md §1, 기존 backend/app/api/v1/endpoints/{ontology,system}.py,
    backend/app/api/health.py(BAC-001 동시 구현 중 - 이 문서는 그 계약만 문서화하고
    backend/app/api/**는 직접 수정하지 않는다), WAVE-1 §7.4 엔드포인트 목록.
    CR-001(2026-08-02) 이후 채널 전략은 WEB_ONLY로 변경 적용되어 전용 KIOSK
    채널은 GUEST_WEB 모바일 웹 세션으로 대체한다. 기존 kiosk 구현/마이그레이션은
    즉시 삭제하지 않고 deprecated 후 cleanup migration으로 처리한다.
    스키마 이름은 .harness/contracts/domain-model.md §13/§15 크로스워크를 따라 실제
    존재하는 스키마.테이블명을 반영한다(프롬프트의 평평한 테이블명이 아니라).
    오류 응답은 .harness/contracts/error-codes.yaml, 온톨로지 코드는
    .harness/contracts/ontology.yaml을 따른다.
  contact:
    name: CONTRACTS track
    url: "https://github.com/example/backju/.harness/contracts"

servers:
  - url: /api/v1
    description: 버전 프리픽스 (backend/app/core/config.py API_V1_PREFIX)

tags:
  - name: system
    description: 헬스체크·시스템 정보 (BAC-001 구현)
  - name: ontology
    description: 온톨로지 조회·해석 (기존 구현, backend/app/api/v1/endpoints/ontology.py)
  - name: profile
    description: 사용자 프로파일 (profile.user_profile 등)
  - name: exhibitors
    description: 업체·부스·제품 조회 (exhibition.*)
  - name: search
    description: 자연어·카테고리 검색 (matching.search_* - CTR-008)
  - name: recommendations
    description: 개인화 추천·검색 결과 반영 추천 (matching.recommendation_session/match_result)
  - name: favorites
    description: 관심 업체 저장 (profile.saved_recommendable - CTR-006)
  - name: buyer
    description: 바이어 매칭 (profile.buyer_need + matching)
  - name: meetings
    description: 상담 요청·상태 전이 (interaction.meeting - 노출 3테이블만, W-7)
  - name: guest
    description: 게스트 웹 세션·임시 관심목록·회원 전환 (CR-001 WEB_ONLY)
  - name: admin
    description: 관리자 운영 - 업체 승인, 부스 상태 (W-9, ai.content_approval)

security:
  - bearerAuth: []

paths:
  # ==========================================================================
  # SYSTEM (BAC-001이 구현, 여기서는 계약만 문서화)
  # ==========================================================================
  /health/live:
    get:
      operationId: getHealthLive
      summary: 프로세스 생존 확인 (의존성 체크 없음)
      tags: [system]
      security: []
      responses:
        "200":
          description: 프로세스가 살아있음
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [alive] }
                required: [status]
  /health/ready:
    get:
      operationId: getHealthReady
      summary: PostgreSQL·Redis(선택적 S3) 연결 확인
      tags: [system]
      security: []
      responses:
        "200":
          description: ready 또는 degraded(S3 warning, READY_CHECK_FAILS_ON_S3_DOWN=false일 때)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyResponse" }
        "503":
          description: not_ready (PostgreSQL/Redis 실패 또는 S3 hard-fail 설정 시)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyResponse" }
  /system/info:
    get:
      operationId: getSystemInfo
      summary: 서비스 메타데이터 (개인정보 없음)
      tags: [system]
      security: []
      responses:
        "200":
          description: 정적 메타데이터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }

  # ==========================================================================
  # ONTOLOGY (기존 구현 문서화)
  # ==========================================================================
  /ontology:
    get:
      operationId: getOntologyMetadata
      summary: 현재 활성 온톨로지 버전 메타데이터
      tags: [ontology]
      security: []
      responses:
        "200":
          description: 카탈로그 메타데이터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OntologyMetadata" }
  /ontology/concepts:
    get:
      operationId: listOntologyConcepts
      summary: 온톨로지 개념 목록 조회
      tags: [ontology]
      security: []
      parameters:
        - name: concept_type
          in: query
          schema: { type: string }
          description: ".harness/contracts/ontology.yaml의 concept_type 값 (23종)"
        - name: parent_code
          in: query
          schema: { type: string }
        - name: assignable_only
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: 개념 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConceptListResponse" }
  /ontology/concepts/{concept_code}:
    get:
      operationId: getOntologyConcept
      summary: 단일 온톨로지 개념 조회
      tags: [ontology]
      security: []
      parameters:
        - name: concept_code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 개념 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConceptDetailResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
  /ontology/resolve:
    post:
      operationId: resolveOntologySynonym
      summary: 자유텍스트를 온톨로지 코드로 해석 (다국어 유사어)
      tags: [ontology]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveSynonymRequest" }
      responses:
        "200":
          description: 매칭 결과 (review_required=true면 다중/무매칭)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveSynonymResponse" }
  /ontology/derive-band:
    post:
      operationId: deriveOntologyBand
      summary: 숫자 값을 구간 코드로 변환 (도수·가격대)
      tags: [ontology]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeriveBandRequest" }
      responses:
        "200":
          description: 변환된 구간 코드
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeriveBandResponse" }
        "422":
          description: 값이 카탈로그 정의 범위 밖 (ONTOLOGY_VALUE_OUT_OF_RANGE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ==========================================================================
  # PROFILE (W-8 §5, profile.user_profile/profile_attribute/buyer_need)
  # ==========================================================================
  /profile/me:
    get:
      operationId: getMyProfile
      summary: 내 행사별 프로파일 조회 (UserProfile+ProfileAttribute+BuyerNeed 조합)
      tags: [profile]
      responses:
        "200":
          description: 프로파일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/NotFound"
  /profile/me/attributes:
    patch:
      operationId: patchMyProfileAttributes
      summary: 관심분야·속성 수정 (source_type=USER_EDITED로 기록, ProfileVersion 스냅샷)
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileAttributesRequest" }
      responses:
        "200":
          description: 갱신된 프로파일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfileResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          description: row_version 낙관적 동시성 충돌 (RESOURCE_CONFLICT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/ValidationError"

  # ==========================================================================
  # GUEST WEB (CR-001 WEB_ONLY, profile.guest_session entry_channel=WEB)
  # ==========================================================================
  /guest/sessions:
    post:
      operationId: startGuestWebSession
      summary: 게스트 웹 익명 세션 시작
      description: >
        전용 키오스크 없이 모바일 웹에서 시작하는 익명 세션. 이름·전화번호·이메일·주소,
        로그인 ID, 장기 브라우저 지문을 받지 않는다.
      tags: [guest]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartGuestWebSessionRequest" }
      responses:
        "201":
          description: 세션 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestWebSessionResponse" }
  /guest/sessions/{guest_session_id}:
    get:
      operationId: getGuestWebSession
      summary: 게스트 웹 세션 상태 조회
      tags: [guest]
      security: []
      parameters:
        - name: guest_session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 세션 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestWebSessionResponse" }
        "410":
          description: GUEST_SESSION_EXPIRED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /guest/sessions/{guest_session_id}/search:
    post:
      operationId: submitGuestWebSearch
      summary: 게스트 웹 세션 자연어·카테고리 검색
      tags: [guest, search]
      security: []
      parameters:
        - name: guest_session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: 검색 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "410":
          description: GUEST_SESSION_EXPIRED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /guest/sessions/{guest_session_id}/favorites:
    post:
      operationId: addGuestWebFavorite
      summary: 게스트 웹 임시 관심 항목 추가
      tags: [guest, favorites]
      security: []
      parameters:
        - name: guest_session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddGuestFavoriteRequest" }
      responses:
        "201":
          description: 임시 저장됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestFavoriteResponse" }
  /guest/sessions/{guest_session_id}/favorites/{temporary_favorite_id}:
    delete:
      operationId: removeGuestWebFavorite
      summary: 게스트 웹 임시 관심 항목 제거
      tags: [guest, favorites]
      security: []
      parameters:
        - name: guest_session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: temporary_favorite_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: 제거됨
  /guest/sessions/{guest_session_id}/convert:
    post:
      operationId: convertGuestWebSession
      summary: 게스트 웹 세션을 등록 사용자 프로파일에 명시적으로 연결
      description: >
        로그인/사전등록 연계 후 사용자가 명시적으로 이전을 선택한 경우에만 임시 관심목록과
        방문세션을 등록 사용자에 연결한다. 이 API 자체는 직접식별정보를 받지 않는다.
      tags: [guest, profile]
      parameters:
        - name: guest_session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertGuestWebSessionRequest" }
      responses:
        "200":
          description: 전환 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvertGuestWebSessionResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
        "410":
          description: WEB_ENTRY_LINK_EXPIRED 또는 GUEST_SESSION_EXPIRED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ==========================================================================
  # EXHIBITORS/BOOTHS (C-5 §1 /common/exhibitors, /common/booths)
  # ==========================================================================
  /exhibitors/{exhibitor_id}:
    get:
      operationId: getExhibitor
      summary: 업체 상세 조회 (승인된 업체만 - EXHIBITOR_NOT_PUBLISHED)
      tags: [exhibitors]
      security: []
      parameters:
        - name: exhibitor_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 업체 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExhibitorDetailResponse" }
        "404":
          description: 존재하지 않거나 미승인(master_approval_status != APPROVED, AGENTS.md §8)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /booths/{booth_id}:
    get:
      operationId: getBooth
      summary: 부스 상세 조회 (운영상태·혼잡도 포함)
      tags: [exhibitors]
      security: []
      parameters:
        - name: booth_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 부스 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoothDetailResponse" }
        "404":
          $ref: "#/components/responses/NotFound"

  # ==========================================================================
  # SEARCH (W-8 §5 POST /search + C-5 §1 POST /common/search, matching.search_*)
  # CR-001 이후 REGISTERED_WEB/GUEST_WEB/BUYER_WEB이 같은 검색 파사드를 공유한다.
  # ==========================================================================
  /search:
    post:
      operationId: submitSearch
      summary: 자연어·카테고리 검색 (구조화+키워드+벡터 RRF, matching.search_session/query/result)
      description: >
        REGISTERED_WEB/BUYER_WEB은 profile_id 기반, GUEST_WEB은 guest_session_id 기반으로
        분기한다. 전용 KIOSK 채널은 CR-001로 제외됐다.
      tags: [search]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: 검색 결과 (0건이면 meta.code=SEARCH_NO_RESULT, 빈 배열 - 오류 아님)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "422":
          description: SEARCH_QUERY_INVALID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: AI_SERVICE_UNAVAILABLE (AI 의도추출 실패 - 카테고리 폴백 안내)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /search/clarify:
    post:
      operationId: clarifySearch
      summary: 낮은 신뢰도·무결과 검색의 추가질문 제출
      tags: [search]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchClarifyRequest" }
      responses:
        "200":
          description: 재검색 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
  /search/{search_session_id}:
    get:
      operationId: getSearchSession
      summary: 검색 세션 재조회
      tags: [search]
      parameters:
        - name: search_session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 검색 세션 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }

  # ==========================================================================
  # RECOMMENDATIONS (W-8 §5 GET /recommendations + C-5 §1 POST /common/recommendations)
  # ==========================================================================
  /recommendations:
    get:
      operationId: getRecommendations
      summary: 개인화 추천 목록 (기존 오케스트레이터, matching.recommendation_session/match_result)
      tags: [recommendations]
      parameters:
        - name: recommendation_type
          in: query
          schema:
            type: string
            enum: [BOOTH, PRODUCT, EXHIBITOR, PROGRAM, MIXED]
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 추천 결과 (페이지네이션)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationListResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
  /recommendations/{recommendation_session_id}:
    get:
      operationId: getRecommendationSession
      summary: 특정 추천 세션 재조회 (재현성 - context_snapshot 포함)
      tags: [recommendations]
      parameters:
        - name: recommendation_session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 추천 세션 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationListResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==========================================================================
  # FAVORITES (W-8 §4/§5, profile.saved_recommendable - CTR-006)
  # ==========================================================================
  /favorites:
    get:
      operationId: listFavorites
      summary: 관심 업체 목록 조회 (S-4)
      tags: [favorites]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 관심 목록 (페이지네이션)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteListResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
    post:
      operationId: addFavorite
      summary: 관심 업체 저장 (S-5 저장 버튼) - GUEST_WEB 접근 불가
      tags: [favorites]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddFavoriteRequest" }
      responses:
        "201":
          description: 저장됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: GUEST_WEB 접근 불가 (지속 프로파일 없음 원칙, W-1 §3)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: 이미 저장됨 (UNIQUE(profile_id, recommendable_id), RESOURCE_CONFLICT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /favorites/{saved_recommendable_id}:
    delete:
      operationId: removeFavorite
      summary: 관심 업체 저장 해제 (멱등 - 이미 없어도 204)
      tags: [favorites]
      parameters:
        - name: saved_recommendable_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: 해제됨(멱등 - 이미 해제된 상태여도 204)
        "401":
          $ref: "#/components/responses/AuthRequired"

  # ==========================================================================
  # BUYER MATCHING (W-7, matching + profile.buyer_need)
  # ==========================================================================
  /buyer/matches:
    get:
      operationId: listBuyerMatches
      summary: 바이어 매칭 후보 목록 (최대 4개 비교, W-7 §4 - saved_recommendable 병렬 조회)
      tags: [buyer]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 매칭 후보 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationListResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: 바이어 검증 미완료 (PERMISSION_DENIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ==========================================================================
  # MEETINGS (W-7, interaction.meeting/meeting_status_history/meeting_contact_share)
  # ==========================================================================
  /buyer/matches/{exhibitor_id}/meetings:
    post:
      operationId: createMeetingRequest
      summary: 상담 요청 생성 (W-7 흐름 1단계)
      tags: [meetings]
      parameters:
        - name: exhibitor_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMeetingRequest" }
      responses:
        "201":
          description: 생성됨 (status=REQUESTED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: EXHIBITOR_NOT_PUBLISHED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /meetings/{meeting_id}/status:
    patch:
      operationId: updateMeetingStatus
      summary: 상담 상태 전이 (수락/거절 - W-7 흐름 2단계, 웹 화면은 두 갈래만 노출)
      description: >
        interaction.meeting.status 10종 CHECK 어휘 중 웹 화면(S-6)이 실제로 요청 가능한
        전이는 REQUESTED -> CONFIRMED 또는 REJECTED/CANCELLED_BY_BUYER 뿐이다(W-7 §1).
        허용되지 않는 전이는 INVALID_STATE_TRANSITION(409). CONFIRMED로 전이될 때만
        연락처 공개 처리(MeetingContactShare)가 트리거된다(AGENTS.md §8).
      tags: [meetings]
      parameters:
        - name: meeting_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeetingStatusRequest" }
      responses:
        "200":
          description: 갱신된 상담
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          description: INVALID_STATE_TRANSITION 또는 MEETING_CONFLICT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ==========================================================================
  # ADMIN (W-9, ai.content_approval - CTR-007 스키마 소비)
  # ==========================================================================
  /admin/content-approvals:
    post:
      operationId: createContentApproval
      summary: 업체정보 AI 추출 결과 승인/반려 (W-9, C-5 §1 /common/content-approvals)
      description: >
        DATA_REVIEWER는 별도 role_code가 아니라 EVENT_ADMIN(OPERATOR) 내부 서비스
        계층 권한 스코프다(DEC-008). 승인 확정 시 exhibitor.master_approval_status
        갱신 + 재임베딩 잡 큐잉(ADMIN.EXHIBITOR_APPROVED 이벤트, event-catalog.yaml)이
        트리거된다.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContentApprovalRequest" }
      responses:
        "201":
          description: 승인/반려 처리됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentApprovalResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: EVENT_ADMIN 권한 부족 (PERMISSION_DENIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/booths/{booth_id}/status:
    patch:
      operationId: updateBoothStatus
      summary: 부스 운영상태 변경 (exhibition.booth_status_history 신규 행)
      tags: [admin]
      parameters:
        - name: booth_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBoothStatusRequest" }
      responses:
        "200":
          description: 갱신된 부스 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoothDetailResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        profile.user_account 인증 세션 토큰. GUEST_WEB 익명 경로는 security: []로
        명시된 엔드포인트에서만 guest_session_id(바디/경로)와 단기 토큰으로 대체 인가한다.

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    NotFound:
      description: RESOURCE_NOT_FOUND
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AuthRequired:
      description: AUTHENTICATION_REQUIRED
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PermissionDenied:
      description: PERMISSION_DENIED
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ------------------------------------------------------------------------
    # 공통 오류 봉투 (error-codes.yaml과 정합)
    # ------------------------------------------------------------------------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: ".harness/contracts/error-codes.yaml http_error_codes[].code 중 하나"
              example: VALIDATION_ERROR
            message: { type: string }
            request_id: { type: string, format: uuid }
            details:
              type: object
              nullable: true
              additionalProperties: true

    PageMeta:
      type: object
      required: [page, page_size, total_count]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_count: { type: integer }

    # ------------------------------------------------------------------------
    # SYSTEM
    # ------------------------------------------------------------------------
    SystemInfo:
      type: object
      required: [service, version, environment, contract_version]
      properties:
        service: { type: string, example: backju-ai-matching-api }
        version: { type: string }
        environment: { type: string, example: local }
        contract_version: { type: string }
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, degraded, not_ready] }
        checks:
          type: object
          required: [postgres, redis, s3]
          properties:
            postgres: { type: string, enum: [ok, error, warning] }
            redis: { type: string, enum: [ok, error, warning] }
            s3: { type: string, enum: [ok, error, warning] }

    # ------------------------------------------------------------------------
    # ONTOLOGY (ontology.yaml 계약과 정합)
    # ------------------------------------------------------------------------
    OntologyMetadata:
      type: object
      properties:
        taxonomy_version: { type: string }
        status: { type: string, enum: [DRAFT, REVIEW, PUBLISHED, RETIRED] }
        default_locale: { type: string }
        concept_count: { type: integer }
    Concept:
      type: object
      properties:
        code: { type: string }
        concept_type: { type: string }
        parent: { type: string, nullable: true }
        label_ko: { type: string }
        label_en: { type: string, nullable: true }
        assignable: { type: boolean }
    ConceptListResponse:
      type: object
      properties:
        taxonomy_version: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/Concept" }
    ConceptDetailResponse:
      type: object
      properties:
        taxonomy_version: { type: string }
        concept: { $ref: "#/components/schemas/Concept" }
    ResolveSynonymRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }
        locale: { type: string, default: ko-KR }
        context: { type: string, default: ANY }
    ResolveSynonymResponse:
      type: object
      properties:
        taxonomy_version: { type: string }
        matches:
          type: array
          items:
            type: object
            properties:
              concept_code: { type: string }
              priority: { type: integer }
              context: { type: string }
              locale: { type: string }
        review_required: { type: boolean }
    DeriveBandRequest:
      type: object
      required: [metric, value]
      properties:
        metric: { type: string, enum: [alcohol_percentage, price_krw] }
        value: { type: number, minimum: 0 }
    DeriveBandResponse:
      type: object
      properties:
        taxonomy_version: { type: string }
        concept_code: { type: string }

    # ------------------------------------------------------------------------
    # PROFILE (profile.user_profile/profile_attribute/buyer_need)
    # ------------------------------------------------------------------------
    ProfileAttributeItem:
      type: object
      properties:
        attribute_code: { type: string, description: "ontology.yaml 코드 (예: GOAL.TASTING)" }
        requirement_level:
          type: string
          enum: [REQUIRED, PREFERRED, ACCEPTABLE, EXCLUDED]
        source_type:
          type: string
          enum: [USER_SELECTED, USER_EDITED, REGISTRATION, BEHAVIOR_SINGLE, AI_EXTRACTED]
          description: "W-4 §2/§5 - 웹 모듈은 이 5종만 채운다"
    UserProfileResponse:
      type: object
      properties:
        profile_id: { type: string, format: uuid }
        user_type:
          type: string
          enum: [GENERAL_REGISTERED, BUYER_REGISTERED]
          description: "API 레이어 매핑값 - DB의 GENERAL_VISITOR/BUYER는 그대로 유지 (W-8 §2)"
        profile_status: { type: string, enum: [DRAFT, COMPLETE, INACTIVE] }
        completeness_score: { type: number, minimum: 0, maximum: 100 }
        row_version: { type: integer, description: "낙관적 동시성 - PATCH 시 If-Match로 사용" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ProfileAttributeItem" }
        buyer_need:
          type: object
          nullable: true
          description: "user_type=BUYER_REGISTERED일 때만 존재 (profile.buyer_need)"
    UpdateProfileAttributesRequest:
      type: object
      required: [row_version, attributes]
      properties:
        row_version: { type: integer, description: "낙관적 동시성 검사용 현재 버전" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ProfileAttributeItem" }

    # ------------------------------------------------------------------------
    # GUEST WEB (profile.guest_session entry_channel=WEB)
    # ------------------------------------------------------------------------
    StartGuestWebSessionRequest:
      type: object
      required: [event_id]
      properties:
        event_id: { type: string, format: uuid }
        language: { type: string, default: ko-KR }
        entry_method:
          type: string
          enum: [EVENT_WEBSITE, QR, SHORT_URL, EMAIL_LINK, REGISTRATION_LINK]
        entry_context:
          type: object
          nullable: true
          additionalProperties: true
          description: "topic QR, booth QR 등 비PII 진입 컨텍스트"
    GuestWebSessionResponse:
      type: object
      properties:
        guest_session_id: { type: string, format: uuid }
        channel: { type: string, enum: [GUEST_WEB] }
        language: { type: string }
        session_status: { type: string, enum: [ACTIVE, CONVERTED, EXPIRED, PURGED] }
        expires_at: { type: string, format: date-time }
        temporary_favorites:
          type: array
          items: { $ref: "#/components/schemas/GuestFavoriteResponse" }
    AddGuestFavoriteRequest:
      type: object
      required: [recommendable_id]
      properties:
        recommendable_id: { type: string, format: uuid }
        saved_context_json:
          type: object
          nullable: true
          additionalProperties: true
    GuestFavoriteResponse:
      type: object
      properties:
        temporary_favorite_id: { type: string }
        recommendable_id: { type: string, format: uuid }
        saved_at: { type: string, format: date-time }
    ConvertGuestWebSessionRequest:
      type: object
      properties:
        transfer_temporary_favorites: { type: boolean, default: true }
        profile_link_token:
          type: string
          nullable: true
          description: "사전등록 개인 링크/배지 QR의 단기 토큰. 원문 PII 포함 금지"
    ConvertGuestWebSessionResponse:
      type: object
      properties:
        profile: { $ref: "#/components/schemas/UserProfileResponse" }
        transferred_favorite_count: { type: integer }
        converted_at: { type: string, format: date-time }

    # ------------------------------------------------------------------------
    # EXHIBITORS/BOOTHS
    # ------------------------------------------------------------------------
    ExhibitorDetailResponse:
      type: object
      properties:
        exhibitor_id: { type: string, format: uuid }
        exhibitor_name: { type: string }
        business_types:
          type: array
          items: { type: string, description: "온톨로지 코드" }
        booths:
          type: array
          items: { type: string, format: uuid }
    BoothDetailResponse:
      type: object
      properties:
        booth_id: { type: string, format: uuid }
        exhibitor_id: { type: string, format: uuid }
        operating_status: { type: string, enum: [OPEN, PAUSED, CLOSED] }
        congestion_level: { type: string, enum: [LOW, MEDIUM, HIGH, UNKNOWN] }
        row_version: { type: integer }

    # ------------------------------------------------------------------------
    # SEARCH (matching.search_session/query/result - CTR-008)
    # ------------------------------------------------------------------------
    SearchRequest:
      type: object
      required: [channel, query_type]
      properties:
        channel: { type: string, enum: [REGISTERED_WEB, GUEST_WEB, BUYER_WEB, ADMIN_PREVIEW] }
        profile_id:
          type: string
          format: uuid
          nullable: true
          description: "REGISTERED_WEB/BUYER_WEB 개인화 또는 바이어 매칭 컨텍스트"
        guest_session_id: { type: string, format: uuid, nullable: true }
        query_type: { type: string, enum: [FREE_TEXT, CATEGORY] }
        query_text:
          type: string
          maxLength: 500
          nullable: true
          description: "AIS-005 의도추출 대상 원문. CATEGORY 질의는 생략 가능"
        concept_codes:
          type: array
          items: { type: string }
          description: "CATEGORY 질의 시 선택된 온톨로지 코드 목록 (ontology.yaml 소비)"
      example:
        channel: GUEST_WEB
        query_type: FREE_TEXT
        query_text: "물류센터에 적용할 로봇 업체"
        guest_session_id: "00000000-0000-0000-0000-000000000000"
    SearchClarifyRequest:
      type: object
      required: [search_session_id, clarification_text]
      properties:
        search_session_id: { type: string, format: uuid }
        clarification_text: { type: string, minLength: 1, maxLength: 500 }
    SearchResultItem:
      type: object
      properties:
        recommendable_id: { type: string, format: uuid }
        rank: { type: integer }
        final_score: { type: number, nullable: true }
        reason_codes:
          type: array
          items: { type: string }
    SearchResponse:
      type: object
      properties:
        search_query_id: { type: string, format: uuid }
        result_count: { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResultItem" }
        meta:
          type: object
          nullable: true
          properties:
            code: { type: string, enum: [SEARCH_NO_RESULT], nullable: true }

    # ------------------------------------------------------------------------
    # RECOMMENDATIONS
    # ------------------------------------------------------------------------
    RecommendationResultItem:
      type: object
      properties:
        match_result_id: { type: string, format: uuid }
        recommendable_id: { type: string, format: uuid }
        rank: { type: integer }
        normalized_score: { type: number }
        recommended_action:
          type: string
          nullable: true
          description: "matching.RECOMMENDED_ACTIONS 10종 중 하나 (0008_widen_recommended_action)"
        reasons:
          type: array
          items:
            type: object
            properties:
              reason_code: { type: string }
              reason_text: { type: string }
    RecommendationListResponse:
      type: object
      properties:
        recommendation_session_id: { type: string, format: uuid }
        results:
          type: array
          items: { $ref: "#/components/schemas/RecommendationResultItem" }
        page: { $ref: "#/components/schemas/PageMeta" }

    # ------------------------------------------------------------------------
    # FAVORITES (profile.saved_recommendable)
    # ------------------------------------------------------------------------
    AddFavoriteRequest:
      type: object
      required: [recommendable_id]
      properties:
        recommendable_id: { type: string, format: uuid }
        saved_context_json:
          type: object
          nullable: true
          additionalProperties: true
          description: "저장 시점 zone/검색어 등 (선택적, W-8 §4)"
    FavoriteResponse:
      type: object
      properties:
        saved_recommendable_id: { type: string, format: uuid }
        recommendable_id: { type: string, format: uuid }
        saved_at: { type: string, format: date-time }
    FavoriteListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FavoriteResponse" }
        page: { $ref: "#/components/schemas/PageMeta" }

    # ------------------------------------------------------------------------
    # MEETINGS (interaction.meeting - 노출 3테이블만)
    # ------------------------------------------------------------------------
    CreateMeetingRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 1000
          description: "message_enc로 암호화 저장 - 평문 컬럼 없음"
    MeetingResponse:
      type: object
      properties:
        meeting_id: { type: string, format: uuid }
        status:
          type: string
          enum:
            [
              REQUESTED,
              VIEWED,
              COUNTER_PROPOSED,
              CONFIRMED,
              COMPLETED,
              FOLLOW_UP,
              REJECTED,
              CANCELLED_BY_BUYER,
              CANCELLED_BY_EXHIBITOR,
              NO_SHOW,
            ]
        contact_disclosed:
          type: boolean
          description: "status=CONFIRMED이고 disclosed 권한 검사 통과 전에는 항상 false (AGENTS.md §8)"
    UpdateMeetingStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [CONFIRMED, REJECTED, CANCELLED_BY_BUYER, CANCELLED_BY_EXHIBITOR]
          description: "웹 화면(S-6)이 실제로 요청 가능한 전이만 (W-7 §1)"

    # ------------------------------------------------------------------------
    # ADMIN (ai.content_approval - CTR-007 스키마)
    # ------------------------------------------------------------------------
    CreateContentApprovalRequest:
      type: object
      required: [exhibitor_id, decision]
      properties:
        exhibitor_id: { type: string, format: uuid }
        decision: { type: string, enum: [APPROVED, REJECTED] }
        note: { type: string, nullable: true, maxLength: 1000 }
    ContentApprovalResponse:
      type: object
      properties:
        content_approval_id: { type: string, format: uuid }
        exhibitor_id: { type: string, format: uuid }
        decision: { type: string, enum: [APPROVED, REJECTED] }
        approved_at: { type: string, format: date-time }
    UpdateBoothStatusRequest:
      type: object
      required: [operating_status]
      properties:
        operating_status: { type: string, enum: [OPEN, PAUSED, CLOSED] }
        congestion_level:
          type: string
          enum: [LOW, MEDIUM, HIGH, UNKNOWN]
          nullable: true
        row_version: { type: integer, description: "낙관적 동시성 검사용 현재 버전" }
