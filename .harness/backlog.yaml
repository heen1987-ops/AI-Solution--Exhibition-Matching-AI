    note: "Found and independently confirmed twice (2026-08-12, indoor-route-navigation workflow + human re-verification) inherited from the 2026-08-11 WAVE2CDE merge (commit bda6af6) — predates and is unrelated to any single feature. Root cause is almost certainly a vite/vitest version mismatch where the installed vite's ESBuildOptions type no longer includes `jsx` as a bare top-level key (may need `esbuild: {jsx: 'automatic', jsxImportSource: 'react'}` restructured under a different vite option, or a vite/vitest version bump) — read the actual installed vite version's type definitions before guessing at a fix."
    evidence: |
      2026-08-13. Root cause is NOT a config-shape defect — vitest.config.ts required ZERO changes and is unmodified. Investigated the installed vite@8.2.1's own d.ts (node_modules/.pnpm/vite@8.2.1.../vite/types/internal/esbuildOptions.d.ts): `ESBuildOptions extends EsbuildTransformOptions`, where `EsbuildTransformOptions = esbuild.TransformOptions` comes from `import type esbuild from 'esbuild'` guarded by `@ts-ignore` ("esbuild may not be installed"). `esbuild` is only vite's OPTIONAL peerDependency (`^0.27.0 || ^0.28.0`, never a real dependency), and apps/user-web/package.json never declares it directly, so in an isolated install that import silently fails to resolve, `EsbuildTransformOptions` collapses to `any`, and `interface X extends any` contributes no inherited members — leaving ESBuildOptions as just `{include?, exclude?, jsxInject?, minify?: never}`, hence "'jsx' does not exist".
      Ruled out two config-only (vitest.config.ts-only) workarounds before concluding no in-file fix was needed: (1) `declare module "vite" { interface ESBuildOptions {...} } }` → TS2664, "vite" is not a directly resolvable module name from apps/user-web (only reachable transitively through vitest's own nested node_modules under this repo's strict pnpm layout); (2) routing the object through a separately-typed `const` to dodge excess-property checks still fails, because ESBuildOptions is a TS "weak type" (all-optional members) and the override object shares zero property names with it, so TS's weak-type-detection rejects it outright (not an excess-property-check issue an indirection trick can dodge). Neither is a genuine typed fix, so both were discarded in favor of finding the real cause.
      The real fix already exists at the repo root: pnpm-workspace.yaml already has `overrides: { esbuild: 0.28.1 }` plus `allowBuilds: { esbuild: true }`, which makes pnpm resolve/install esbuild to satisfy vite's optional peer once a real `pnpm install` runs from the workspace root. Verified in a clean C:\ temp copy that mirrors the real workspace (root pnpm-workspace.yaml + root package.json + the real committed pnpm-lock.yaml + apps/user-web only, `pnpm install --filter backju-ai-sherpa-frontend`): `tsc --noEmit` exits 0 with zero errors, and `vitest run` → 24 test files, 122 tests, all passing (verified actual current count directly from apps/user-web's test files in this repo state, not assumed) — vitest.config.ts's oxc:false + esbuild.jsx/jsxImportSource override was left byte-for-byte unchanged, so runtime JSX transform behavior is provably unaffected.
      The prior "confirmed twice" TS2769 failures were an artifact of verification methodology, not a real unfixable defect: every earlier reproduction (and my own first attempt) copied ONLY apps/user-web into an isolated temp folder, omitting the root pnpm-workspace.yaml, so pnpm never saw the `esbuild` override and never resolved it. The isolated-copy setup reproduces the failure regardless of whether vitest.config.ts is correct.
      Separate, real, NOT fixed here (outside owned_paths apps/user-web/vitest.config.ts, and outside this task's authorized scope of touching only that one file): the repo's checked-in root pnpm-lock.yaml is currently stale relative to pnpm-workspace.yaml's `overrides` field — `pnpm install --frozen-lockfile` fails today with `ERR_PNPM_LOCKFILE_CONFIG_MISMATCH` ("the current overrides configuration doesn't match the value found in the lockfile"). A plain non-frozen `pnpm install` self-heals it, but any CI/workflow step using `--frozen-lockfile` will fail repo-wide until someone regenerates pnpm-lock.yaml via a real `pnpm install` run from a clean, non-Google-Drive path against the full monorepo. Flagged separately as a follow-up rather than fixed here.
      Also checked apps/kiosk/vitest.config.ts per instructions: it has the identical `oxc: false` + `esbuild: {jsx, jsxImportSource}` shape (not already fixed), so it very likely shares the exact same root cause/fix — low-priority follow-up, not touched here since it is outside owned_paths.

