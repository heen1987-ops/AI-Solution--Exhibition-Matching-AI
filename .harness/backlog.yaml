  - id: CONTRACT-005
    title: 관심목록 영속 모델·API 계약 게시
    wave: 2
    track: CONTRACTS
    priority: P1
    status: DONE
    depends_on: [CONTRACT-003]
    owned_paths:
      - ".harness/handoffs/contracts/change-request-005-favorites.md"
      - "apps/api/app/models/favorite.py"
      - "apps/api/alembic/**"
      - ".harness/contracts/domain-model.md"
    acceptance:
      - "즐겨찾기 소유자·행사·recommendable 경계와 중복·삭제 정책이 CR에 기록된다"
      - "모델과 Alembic 마이그레이션 소유권을 CONTRACTS가 게시한 뒤 BACKEND-009에 인계한다"
      - "Alembic 단일 head와 upgrade/downgrade SQL 컴파일을 유지한다"
    note: "G1 동결 후 새 테이블이 필요하므로 BACKEND-009보다 먼저 처리한다."
    evidence: >
      docs/db-erd-table-spec.md §16.1을 근거로 apps/api/app/models/favorite.py에 Favorite
      ORM 모델(interaction.favorite)을 게시했다. 소유자 경계는 CHECK
      num_nonnulls(user_id, guest_session_id) = 1(정확히 하나, InteractionEvent의 "<= 1"과
      다름). 대상 경계는 이 리포의 기존 관례를 그대로 따라 (tenant_id, event_id,
      recommendable_id) 3컬럼 복합 FK로 exhibition.recommendable을 참조한다(단일 컬럼 FK를
      새로 발명하지 않음 — matching.py의 MatchResult/InteractionEvent/
      RecommendationImpression과 동일 형태). match_result_id는 nullable 단일 컬럼 FK(모든
      즐겨찾기가 특정 추천 결과에서 비롯되지 않으므로). source는 CHECK로 SEARCH/RECOMMENDATION만
      허용. 중복 방지는 db-erd §16.1 "인증·익명 각각 활성 partial unique"대로 두 개의 partial
      UNIQUE 인덱스(uq_favorite_active_user_recommendable,
      uq_favorite_active_guest_recommendable, 각각 WHERE deleted_at IS NULL AND
      user_id/guest_session_id IS NOT NULL)로 구현 — 소프트 삭제(deleted_at) 후 같은
      owner+recommendable 재저장이 unique 위반 없이 가능함을 컴파일된 DDL과
      apps/api/tests/test_favorite_model.py로 검증했다.

      마이그레이션: apps/api/alembic/versions/20260813_0032_favorite.py, revision
      "0032_favorite", down_revision "0031_integration_source_sync"(단일 head 유지).
      CheckConstraint 이름은 op.f()로 감싸 Alembic이 NAMING_CONVENTION을 이중 적용해
      더블 프리픽스(예: ck_favorite_ck_favorite_...)로 깨지는 것을 막았다 — 이 더블 프리픽스는
      0030_event_ingestion_failure의 실제 컴파일된 SQL에서 재현되는 이 리포의 기존 잠재 버그이며
      (op.f() 미사용 탓), 본 작업 범위 밖이라 기존 파일은 고치지 않고 새 파일에서만 올바른
      패턴(0011_slate_policy.py가 이미 쓰던 방식)을 따랐다.

      판단 콜(스코프 이탈, 상세는 CR-005 "owned_paths 밖 판단" 절): (1)
      apps/api/app/models/__init__.py에 favorite 모듈을 등록했다 — 등록하지 않으면 기존
      tests/test_alembic_orm_parity.py 가드가 즉시 실패하므로(신규 파일 1개만 등록하는 가역적
      저위험 변경). (2) apps/api/tests/test_exhibitor_models.py의 하드코딩된 두 기준값(테이블
      수 135→136, alembic heads 기대값 0031→0032)을 갱신했다 — 갱신하지 않으면 이 CR과 무관한
      기존 회귀 테스트가 깨진 채로 남는다.

      apps/api/app/api/v1/api.py, 라우터, 스키마는 건드리지 않았다(BACKEND-009 범위, 작업
      지시 명시 제외).

      테스트: apps/api/tests/test_favorite_model.py 신규 15건(테이블 등록, source 상수,
      스키마 소속, num_nonnulls CHECK 이름·내용, source CHECK, recommendable 3컬럼 복합 FK,
      user_id/guest_session_id FK 대상, match_result_id nullable 단일 FK, 두 partial unique
      인덱스 각각의 컬럼·WHERE절 정확한 스코프, 총 unique 인덱스 개수, deleted_at 컬럼,
      InteractionEvent의 FAVORITE_ADD/FAVORITE_REMOVE와 다른 테이블임을 구분하는 가드) — 전부
      compiled-SQL 어서션(CreateTable/CreateIndex, postgresql dialect), 라이브 DB 불필요.

      검증 수치: 변경 전 `python -m pytest apps/api/tests -q` = 1126 passed, 3 skipped,
      1 xfailed. 변경 후 = 1141 passed(=1126+15 신규), 3 skipped, 1 xfailed — 기존 테스트
      회귀 없음. `alembic heads` = 단일 `0032_favorite`. `alembic upgrade head --sql`
      오프라인 컴파일 EXIT 0(라이브 DB 미접속, favorite 테이블 DDL·4개 인덱스 전부 포함 확인).
      `python -m ruff check`(수정한 4개 파일: favorite.py, models/__init__.py,
      20260813_0032_favorite.py, test_favorite_model.py) 전부 통과. test_exhibitor_models.py는
      기존에도 있던 무관한 import-order 경고 1건이 있으나 이번 diff(숫자 리터럴 2곳)와는
      무관해 손대지 않았다.

      계약 문서: .harness/contracts/domain-model.md에 favorite.py 행 추가(모듈 요약, 32
      마이그레이션/136 테이블/단일 head 0032_favorite로 헤더 갱신) +
      .harness/handoffs/contracts/change-request-005-favorites.md 신규(소유자·경계·중복·
      소프트삭제 정책 전문과 BACKEND-009 인계 조건, 롤백 절차 기록).

