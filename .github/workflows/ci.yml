name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-api:
    name: Engine and API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/api/pyproject.toml
            apps/worker/pyproject.toml

      - name: Install engine, API, and worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -e "./apps/api[dev]" -e "./apps/worker[dev]"

      - name: Check fatal Python lint errors
        run: >-
          python -m ruff check
          --select E9,F63,F7,F82
          src/meet_ai apps/api/app apps/api/tests tests ai apps/worker/worker apps/worker/tests

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Test common matching engine
        run: python -m pytest -q

      - name: Test AI extraction/buyer-matching modules
        run: python -m pytest -q ai/tests

      - name: Test FastAPI backend
        run: python -m pytest -q apps/api/tests

      - name: Test async worker jobs
        run: python -m pytest -q apps/worker/tests

  active-web:
    name: Active web apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint active web apps
        run: pnpm lint

      - name: Type-check active web apps and functions
        run: pnpm typecheck

      - name: Run active web tests
        run: pnpm test

      - name: Build active web apps
        run: pnpm build
