[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backju-backend"
version = "0.1.0"
description = "Backju AI matching service - FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pgvector>=0.5.0,<0.6.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "cryptography>=49.0.0,<50.0.0",
    "PyJWT[crypto]>=2.10.1,<3.0.0",
    "PyOTP>=2.9.0,<3.0.0",
    "webauthn>=3.0.0,<4.0.0",
    # BACKEND-DOCUMENT (WAVE 2D): multipart file upload (POST /partner/documents) needs
    # FastAPI's Form()/UploadFile() support, which requires this package at runtime.
    # The shared dev venv happens to have it already; declaring it keeps CI honest.
    "python-multipart>=0.0.9",
    # ROUTE-001 (U-13): app/services/routing/pathfinding.py's visit-order optimizer uses this
    # real open-source TSP solver (python_tsp.heuristics.solve_tsp_local_search) instead of a
    # hand-rolled 2-opt loop - see that module's docstring. numpy is python-tsp's own
    # distance-matrix dependency, not otherwise used in this codebase.
    "python-tsp>=0.4.0,<1.0.0",
    "numpy>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# ".."/".." is the repository root: the top-level ``ai`` package (ai/buyer_matching,
# ai/extraction, ai/evaluation) lives there, not under apps/api, and tests such as
# tests/test_ai_buyer_matching.py import it directly. "../../src" carries meet_ai.
pythonpath = [".", "../..", "../../src"]
asyncio_mode = "auto"
markers = [
    "postgres_integration: requires a migrated PostgreSQL database",
]
