version: "3.9"

# 로컬 개발용 인프라 스택. 운영 배포는 별도 구성을 사용한다.
# docs/db-erd-table-spec.md 3절 권장 물리 구성: PostgreSQL(+pgvector), Redis.
# minio는 로컬 개발용 S3 호환 Object Storage로만 사용한다(운영은 관리형 S3 호환
# 스토리지 - ARCHITECTURE.md 고정 기술스택 참고).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: backju-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backju}
      POSTGRES_USER: ${POSTGRES_USER:-backju}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backju}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - backju_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backju} -d ${POSTGRES_DB:-backju}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: backju-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - backju_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: backju-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - backju_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-bucket-init:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    container_name: backju-minio-bucket-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-backju-dev} &&
      echo 'bucket ready: ${S3_BUCKET:-backju-dev}'
      "

volumes:
  backju_postgres_data:
  backju_redis_data:
  backju_minio_data:
