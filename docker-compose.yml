version: "3.9"

# 로컬 개발용 인프라 스택. 운영 배포는 별도 구성을 사용한다.
# docs/db-erd-table-spec.md 3절 권장 물리 구성: PostgreSQL(+pgvector), Redis.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: backju-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backju}
      POSTGRES_USER: ${POSTGRES_USER:-backju}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backju}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - backju_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backju} -d ${POSTGRES_DB:-backju}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: backju-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - backju_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backju_postgres_data:
  backju_redis_data:
